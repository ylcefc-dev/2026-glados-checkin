name: Network Diag v2 (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run probe
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
        run: python diag_probe.py

      - name: Curl HTTP/1.1 repeat
        run: |
          set +e
          for i in 1 2 3; do
            curl -sS -o /dev/null -m 30 --http1.1 \
              -w "http1.1 #$i code=%{http_code} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\n" \
              https://glados.cloud/api/user/status
          done
