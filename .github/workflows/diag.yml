name: Network Diag (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: DNS resolution
        run: |
          set +e
          echo "=== getent hosts ==="
          for d in glados.cloud glados.rocks glados.network api.github.com; do
            echo "-- $d"
            getent hosts "$d" || echo "  (no result)"
          done
          echo "=== dig if available ==="
          which dig >/dev/null 2>&1 && dig +short glados.cloud || echo "dig not installed"

      - name: Curl timing matrix
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          probe () {
            echo "-- $1"
            curl -sS -o /dev/null -m 25 \
              -w "   code=%{http_code} dns=%{time_namelookup} conn=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} ip=%{remote_ip}\n" \
              -H "User-Agent: $UA" "$1" || echo "   curl exit=$?"
          }
          probe https://glados.cloud/api/user/status
          probe https://glados.rocks/api/user/status
          probe https://glados.network/api/user/status
          probe https://www.cloudflare.com/
          probe https://api.github.com/rate_limit
          probe https://www.baidu.com/

      - name: Verbose handshake (glados.cloud)
        run: |
          set +e
          curl -v -o /dev/null -m 25 https://glados.cloud/api/user/status 2>&1 | sed -n '1,45p'

      - name: HTTP version variants
        run: |
          set +e
          echo "-- http1.1 forced"
          curl -sS -o /dev/null -m 25 --http1.1 -w "   code=%{http_code} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\n" https://glados.cloud/api/user/status || echo "   exit=$?"
          echo "-- ipv4 forced"
          curl -sS -o /dev/null -m 25 -4 -w "   code=%{http_code} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} ip=%{remote_ip}\n" https://glados.cloud/api/user/status || echo "   exit=$?"
          echo "-- homepage"
          curl -sS -o /dev/null -m 25 -w "   code=%{http_code} total=%{time_total}\n" https://glados.cloud/ || echo "   exit=$?"
