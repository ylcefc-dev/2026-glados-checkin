name: Keep Scheduled Workflows Active

# GitHub 会在公开仓库连续 60 天无活动后停用 schedule。
# 每月提交一次时间戳即可，无需每天制造提交。
on:
  schedule:
    - cron: '23 3 1 * *'
  workflow_dispatch:

concurrency:
  group: keep-scheduled-workflows-active
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update timestamp
        run: |
          echo "Last active: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/last-active.txt

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/last-active.txt
          git diff --staged --quiet || git commit -m "chore: keep repository active [skip ci]"
          git pull --rebase origin main
          git push
